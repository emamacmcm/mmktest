<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みみき AI Ver.5</title>
<style>
:root{--bg:#f8f5fc;--card:#fff;--ink:#2e2934;--muted:#8d8498;--accent:#8069ad;--danger:#d94d64}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;min-height:100dvh}.head{position:sticky;top:0;z-index:4;padding:14px;background:#f8f5fcee;backdrop-filter:blur(12px);display:flex;align-items:center;gap:9px}
.title{font-size:19px;font-weight:850;flex:1}.tag{font-size:12px;padding:7px 9px;border-radius:99px;background:#eee8f7;color:#6d5d89}
button{font:inherit}.connect{border:0;background:#fff;border-radius:12px;padding:9px 11px;box-shadow:0 2px 10px #0001}
.card{margin:0 14px 10px;padding:14px;background:#fff;border-radius:20px;box-shadow:0 4px 18px #0000000b}
.row{display:flex;align-items:end;gap:7px}.num{font-size:36px;font-weight:900;line-height:1}.sub{font-size:14px;color:var(--muted);padding-bottom:4px}.state{margin-left:auto;color:#6f6089;font-size:13px;font-weight:750}
canvas{display:block;width:100%;height:185px;margin-top:8px}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.controls{display:flex;gap:8px;margin-top:11px}.wave,.steady{flex:1;border:0;border-radius:12px;padding:10px;background:#eee8f7;color:#62537e;font-weight:750}.active{background:#d9ceec}
.stop{width:100%;border:0;border-radius:13px;padding:12px;margin-top:8px;background:var(--danger);color:#fff;font-weight:850}
.note{text-align:center;font-size:11px;color:var(--muted);margin:0 14px 8px}
.messages{display:flex;flex-direction:column;gap:10px;padding:5px 14px 105px}.bubble{max-width:83%;padding:11px 13px;border-radius:18px;line-height:1.5;font-size:14px;white-space:pre-wrap}
.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#dfd7ee;border-bottom-right-radius:5px}.act{margin-top:5px;color:#75658e;font-size:11px;font-weight:750}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:end;background:linear-gradient(transparent,#f8f5fc 25%)}
textarea{flex:1;resize:none;max-height:100px;border:1px solid #e9e1f0;background:#fff;border-radius:19px;padding:12px 14px;font:inherit;outline:none}.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:20px}
</style></head>
<body><div class="app">
<div class="head"><div class="title">みみき AI</div><div class="tag">キャラクターモード</div><button class="connect" id="connect">Bluetooth接続</button></div>
<section class="card">
<div class="row"><div class="num" id="num">0</div><div class="sub">/ 10</div><div class="state" id="state">停止</div></div>
<canvas id="g"></canvas><div class="legend"><span>0</span><span>1〜10 全強度</span><span>10</span></div>
<div class="controls"><button class="steady" id="steady">一定</button><button class="wave active" id="wave">なみなみ</button></div>
<button class="stop" id="stop">緊急停止</button>
</section>
<div class="note" id="ble">未接続・実機制御コマンドは検証待ち</div>
<div class="messages" id="msgs"><div class="bubble ai">ここにいるよ。まずは「みみきモード」と送ってみて。<div class="act">待機中・0 / 10</div></div></div>
<div class="composer"><textarea id="input" rows="1" placeholder="キャラクターに話しかける…"></textarea><button class="send" id="send">↑</button></div>
</div>
<script>
const SERVICE='0000ffe0-0000-1000-8000-00805f9b34fb', FFE1='0000ffe1-0000-1000-8000-00805f9b34fb', FFE2='0000ffe2-0000-1000-8000-00805f9b34fb';
let dev=null,writeChar=null,level=0,target=0,enabled=false,wave=true,t=0,hist=Array(80).fill(0);
const $=s=>document.querySelector(s),c=$('#g'),x=c.getContext('2d');
function resize(){let d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()} addEventListener('resize',resize);
function draw(){let w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.strokeStyle='#eee8f4';x.lineWidth=1;for(let v=0;v<=10;v+=2){let y=h-10-v/10*(h-20);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}x.strokeStyle='#8069ad';x.lineWidth=4;x.lineJoin='round';x.lineCap='round';x.beginPath();hist.forEach((v,i)=>{let px=i/(hist.length-1)*w,py=h-10-v/10*(h-20);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function setTarget(v){target=Math.max(0,Math.min(10,Math.round(v)));if(target===0){level=0;$('#num').textContent='0';$('#state').textContent='停止'}}
function tick(){t+=.15;if(!enabled||target===0)level=0;else if(wave){let amp=Math.min(2.2,Math.max(.7,target*.20));let v=target + Math.sin(t)*amp + Math.sin(t*.43)*amp*.45;level=Math.max(1,Math.min(10,v))}else level=target;hist.push(level);hist.shift();$('#num').textContent=level?level.toFixed(1):'0';$('#state').textContent=!level?'停止':wave?'なみなみ':'一定';draw()}
setInterval(tick,140);
function add(text,who,act=''){let b=document.createElement('div');b.className='bubble '+who;b.textContent=text;if(act){let a=document.createElement('div');a.className='act';a.textContent=act;b.appendChild(a)}$('#msgs').appendChild(b);b.scrollIntoView({behavior:'smooth',block:'end'})}
function parseNum(s){s=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));let m=s.match(/(?:強度\s*)?(10|[0-9])(?:\s*(?:に|で|くらい|ぐらい))?/);return m?+m[1]:null}
async function talk(s){
 if(/みみき\s*モード/.test(s)){enabled=true;setTarget(5);add('わかった。まずは5くらいから様子を見るね。','ai','なみなみ・中心 5 / 10');return}
 if(/止め|とめ|ストップ|stop|停止/i.test(s)){enabled=false;setTarget(0);add('止めたよ。','ai','停止・0 / 10');return}
 if(/なみ|波|一定じゃなく/.test(s)){wave=true;$('#wave').classList.add('active');$('#steady').classList.remove('active');add('じゃあ、強さを少しずつ揺らしてみるね。','ai',`なみなみ・中心 ${target} / 10`);return}
 let n=parseNum(s);if(n!==null){enabled=n>0;setTarget(n);add(n===0?'止めるね。':`${n}くらいを中心にしてみるね。`,'ai',n?`${wave?'なみなみ':'一定'}・中心 ${n} / 10`:'停止・0 / 10');return}
 if(/強|もっと/.test(s)){enabled=true;setTarget(Math.min(10,(target||4)+1));add('少し上げてみるね。','ai',`${wave?'なみなみ':'一定'}・中心 ${target} / 10`);return}
 if(/弱|きつ|下げ/.test(s)){setTarget(Math.max(1,(target||5)-1));add('少し落とすね。','ai',`${wave?'なみなみ':'一定'}・中心 ${target} / 10`);return}
 add('うん。反応を見ながら、このくらいを保ってみるね。','ai',`${wave?'なみなみ':'一定'}・中心 ${target} / 10`)
}
function send(){let s=$('#input').value.trim();if(!s)return;add(s,'me');$('#input').value='';setTimeout(()=>talk(s),250)}
$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#wave').onclick=()=>{wave=true;$('#wave').classList.add('active');$('#steady').classList.remove('active')};
$('#steady').onclick=()=>{wave=false;$('#steady').classList.add('active');$('#wave').classList.remove('active')};
$('#stop').onclick=()=>{enabled=false;setTarget(0);add('緊急停止しました。','ai','停止・0 / 10')};
$('#connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Web Bluetooth非対応');dev=await navigator.bluetooth.requestDevice({filters:[{name:'SX033A'}],optionalServices:[SERVICE]});let srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(SERVICE);writeChar=await svc.getCharacteristic(FFE1);try{let n=await svc.getCharacteristic(FFE2);if(n.properties.notify)await n.startNotifications()}catch(e){}$('#connect').textContent='接続済み';$('#ble').textContent='SX033A 接続済み・実機制御コマンドは検証待ち'}catch(e){$('#ble').textContent='接続失敗: '+e.message}};
resize();
</script></body></html>
