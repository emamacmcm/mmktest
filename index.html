<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mimiki AI Control</title>
<style>
:root{--bg:#f7f4fb;--card:#fff;--ink:#2d2933;--muted:#8d8795;--line:#e9e2ef;--accent:#7b68a6;--accent2:#b5a7d2;--danger:#d94c63}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px 10px;background:rgba(247,244,251,.94);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.top{display:flex;align-items:center;gap:10px}.title{font-weight:800;font-size:18px;flex:1}.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#eee8f5;color:#625678}
button{font:inherit}.connect{border:0;border-radius:10px;padding:8px 11px;background:#fff;box-shadow:0 1px 5px #0001}
.panel{margin:0 14px 12px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 18px #342a4b10}
.status{display:flex;align-items:end;gap:8px;margin-bottom:6px}.strength{font-size:34px;font-weight:850;line-height:1}.of{color:var(--muted);font-size:14px;padding-bottom:4px}.mode{margin-left:auto;color:#675985;font-size:13px;font-weight:700}
canvas{width:100%;height:190px;display:block}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}
.stop{width:100%;border:0;background:var(--danger);color:white;font-weight:800;border-radius:13px;padding:12px;margin-top:12px}
.chat{flex:1;display:flex;flex-direction:column;min-height:330px}.messages{padding:4px 14px 96px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.bubble{max-width:82%;padding:11px 13px;border-radius:17px;line-height:1.5;font-size:14px;white-space:pre-wrap}.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#ded5ee;border-bottom-right-radius:5px}
.action{font-size:11px;color:#786a92;margin-top:6px;font-weight:700}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f7f4fb 22%);display:flex;gap:8px;align-items:end}
textarea{flex:1;resize:none;max-height:110px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;outline:none;font:inherit;box-shadow:0 3px 14px #0000000b}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:20px}
.note{font-size:11px;color:var(--muted);text-align:center;margin:0 16px 8px}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="top">
   <div class="title">みみき AI</div>
   <span class="pill">みみきモード</span>
   <button class="connect" id="connect">Bluetooth接続</button>
 </div>
</header>

<section class="panel">
 <div class="status"><div class="strength" id="strength">5</div><div class="of">/ 10</div><div class="mode" id="label">弱</div></div>
 <canvas id="graph"></canvas>
 <div class="legend"><span>停止</span><span>みみき実用範囲 5〜10</span><span>強</span></div>
 <button class="stop" id="stop">緊急停止</button>
</section>

<p class="note" id="bleState">プレビュー版：BLEコマンド送信はまだ無効です</p>

<main class="chat">
 <div class="messages" id="messages">
   <div class="bubble ai">みみきモードで待機中。<div class="action">強度 5 / 10</div></div>
 </div>
</main>

<div class="composer">
 <textarea id="input" rows="1" placeholder="メッセージを入力…"></textarea>
 <button class="send" id="send">↑</button>
</div>
</div>

<script>
const SERVICE='0000ffe0-0000-1000-8000-00805f9b34fb';
const FFE1='0000ffe1-0000-1000-8000-00805f9b34fb';
const FFE2='0000ffe2-0000-1000-8000-00805f9b34fb';
let device=null, writeChar=null, notifyChar=null;
let level=5, history=Array(32).fill(5);
const $=s=>document.querySelector(s), canvas=$('#graph'), ctx=canvas.getContext('2d');

function resize(){const dpr=devicePixelRatio||1; const r=canvas.getBoundingClientRect();canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);

function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 ctx.strokeStyle='#eee8f3';ctx.lineWidth=1;
 for(let v=0;v<=10;v+=2){let y=h-12-(v/10)*(h-24);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 const y5=h-12-.5*(h-24);ctx.setLineDash([5,5]);ctx.strokeStyle='#c9bddb';ctx.beginPath();ctx.moveTo(0,y5);ctx.lineTo(w,y5);ctx.stroke();ctx.setLineDash([]);
 const pts=history.map((v,i)=>[i/(history.length-1)*w,h-12-(v/10)*(h-24)]);
 ctx.strokeStyle='#7b68a6';ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
 let p=pts.at(-1);ctx.fillStyle='#7b68a6';ctx.beginPath();ctx.arc(p[0],p[1],6,0,Math.PI*2);ctx.fill()
}
function nameLevel(v){if(v===0)return'停止';if(v<=5)return'弱';if(v===6)return'やや弱';if(v===7)return'中';if(v===8)return'やや強';if(v===9)return'強';return'最大'}
function setLevel(v){
 level=Math.max(0,Math.min(10,v));
 if(level>0 && level<5) level=5; // みみき専用：1〜4を使わない
 history.push(level);history.shift();
 $('#strength').textContent=level;$('#label').textContent=nameLevel(level);draw();
 // 安全のため、正確なBX033Bコマンド確定までは実機へのwriteを行わない
}
function add(text,who,action=''){
 const b=document.createElement('div');b.className='bubble '+who;b.textContent=text;
 if(action){const a=document.createElement('div');a.className='action';a.textContent=action;b.appendChild(a)}
 $('#messages').appendChild(b);b.scrollIntoView({behavior:'smooth',block:'end'});
}
function demoReply(t){
 let next=level, reply='うん、今の強さを保つね。';
 if(/もっと強|強く|あげて|上げて/.test(t)){next=Math.min(10,Math.max(5,level+1));reply='少し強くするね。'}
 else if(/弱く|下げて|よわく/.test(t)){next=Math.max(5,level-1);reply='少し弱めるね。'}
 else if(/止め|ストップ|STOP/i.test(t)){next=0;reply='止めるね。'}
 else if(level===0){next=5;reply='みみきの弱めから始めるね。'}
 setLevel(next);add(reply,'ai',`強度 ${next} / 10・${nameLevel(next)}`);
}
function send(){
 const t=$('#input').value.trim();if(!t)return;add(t,'me');$('#input').value='';setTimeout(()=>demoReply(t),300)
}
$('#send').onclick=send;
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#stop').onclick=()=>{setLevel(0);add('緊急停止しました。','ai','強度 0 / 10・停止')};

$('#connect').onclick=async()=>{
 try{
  if(!navigator.bluetooth) throw new Error('このブラウザではWeb Bluetoothが利用できません');
  device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SX033A'}],optionalServices:[SERVICE]});
  const server=await device.gatt.connect(), service=await server.getPrimaryService(SERVICE);
  writeChar=await service.getCharacteristic(FFE1);notifyChar=await service.getCharacteristic(FFE2);
  if(notifyChar.properties.notify){await notifyChar.startNotifications()}
  $('#bleState').textContent=`${device.name||'SX033A'} 接続済み（安全のため操作コマンド送信はまだ無効）`;
  $('#connect').textContent='接続済み';
 }catch(e){$('#bleState').textContent='接続失敗: '+e.message}
};
resize();
</script>
</body>
</html>
