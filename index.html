<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SX033A BLE 診断 Ver.2</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#0f0f10; color:#f5f5f5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 28px 18px 40px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .sub { color:#b8b8b8; line-height:1.6; }
    .card {
      background:#1b1b1e; border-radius:22px; padding:18px; margin-top:18px;
    }
    button {
      width:100%; border:0; border-radius:16px; padding:16px 18px;
      font-size:20px; margin:8px 0; color:white; background:#1689f7;
    }
    button.secondary { background:#353538; }
    button:disabled { opacity:.45; }
    .ok { color:#31d158; }
    .warn { color:#ffd60a; }
    .muted { color:#aaa; }
    .grid {
      display:grid; grid-template-columns: 1fr; gap:8px; margin-top:10px;
    }
    .kv { padding:10px 12px; background:#111; border-radius:12px; }
    pre {
      white-space:pre-wrap; word-break:break-word; background:#050505;
      border-radius:16px; padding:14px; min-height:120px; max-height:420px;
      overflow:auto; font-size:14px; line-height:1.55;
    }
    .small { font-size:14px; color:#aaa; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { padding:8px 6px; border-bottom:1px solid #333; text-align:center; }
    th:first-child, td:first-child { text-align:left; }
  </style>
</head>
<body>
<main>
  <h1>SX033A BLE 診断 Ver.2</h1>
  <p class="sub">
    接続・Notify受信・差分表示だけを行います。<br>
    <strong>この版は機器へ操作コマンドを書き込みません。</strong>
  </p>

  <section class="card">
    <button id="connectBtn">SX033A に接続</button>
    <button id="disconnectBtn" class="secondary" disabled>切断</button>
    <button id="clearBtn" class="secondary">ログを消去</button>
    <p id="status">状態: 未接続</p>
  </section>

  <section class="card">
    <h2>検出結果</h2>
    <div class="grid">
      <div class="kv">FFE1 (Write Without Response): <span id="ffe1">未確認</span></div>
      <div class="kv">FFE2 (Notify): <span id="ffe2">未確認</span></div>
      <div class="kv">FFF3 (Write): <span id="fff3">未確認</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Notify 統計</h2>
    <div class="grid">
      <div class="kv">受信回数: <span id="count">0</span></div>
      <div class="kv">最新データ: <span id="latest">—</span></div>
      <div class="kv">前回との差分: <span id="diff">—</span></div>
    </div>
    <p class="small">
      「Byte 5: 2A → 2B」のように変わった位置だけ表示します。
    </p>

    <table>
      <thead>
        <tr><th>位置</th><th>最新値</th><th>変化回数</th></tr>
      </thead>
      <tbody id="byteTable"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>FFE2 Notify ログ</h2>
    <pre id="log">まだ受信していません。</pre>
  </section>

<script>
const BASE = x => `0000${x}-0000-1000-8000-00805f9b34fb`;
const SERVICE = BASE('ffe0');
const UUID_FFE1 = BASE('ffe1');
const UUID_FFE2 = BASE('ffe2');
const UUID_FFF3 = BASE('fff3');

let device = null;
let server = null;
let notifyChar = null;
let recvCount = 0;
let previousBytes = null;
let changeCounts = [];

const $ = id => document.getElementById(id);
const logEl = $('log');

function timestamp() {
  return new Date().toLocaleTimeString('ja-JP', {hour12:false});
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}

function setFound(id, text) {
  const el = $(id);
  el.textContent = text;
  el.className = 'ok';
}

function appendLog(text) {
  if (logEl.textContent === 'まだ受信していません。') logEl.textContent = '';
  logEl.textContent += `[${timestamp()}] ${text}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function renderByteTable(bytes) {
  const tbody = $('byteTable');
  tbody.innerHTML = '';
  bytes.forEach((b, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>Byte ${i}</td><td>${b.toString(16).padStart(2,'0').toUpperCase()}</td><td>${changeCounts[i] || 0}</td>`;
    tbody.appendChild(tr);
  });
}

function onNotify(event) {
  const view = event.target.value;
  const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
  recvCount++;
  $('count').textContent = recvCount;
  $('latest').textContent = toHex(bytes);

  let diffs = [];
  if (previousBytes && previousBytes.length === bytes.length) {
    bytes.forEach((b, i) => {
      if (b !== previousBytes[i]) {
        changeCounts[i] = (changeCounts[i] || 0) + 1;
        diffs.push(`Byte ${i}: ${previousBytes[i].toString(16).padStart(2,'0').toUpperCase()} → ${b.toString(16).padStart(2,'0').toUpperCase()}`);
      }
    });
  }

  $('diff').textContent = previousBytes
    ? (diffs.length ? diffs.join(' / ') : '変化なし')
    : '初回受信';

  appendLog(`${toHex(bytes)}${diffs.length ? '    | ' + diffs.join(' / ') : ''}`);
  renderByteTable(bytes);
  previousBytes = Uint8Array.from(bytes);
}

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'SX033A' }],
      optionalServices: [SERVICE]
    });

    device.addEventListener('gattserverdisconnected', () => {
      $('status').textContent = '状態: 切断されました';
      $('status').className = '';
      $('disconnectBtn').disabled = true;
      $('connectBtn').disabled = false;
      appendLog('切断されました');
    });

    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    await service.getCharacteristic(UUID_FFE1);
    setFound('ffe1', '見つかりました');

    notifyChar = await service.getCharacteristic(UUID_FFE2);
    notifyChar.addEventListener('characteristicvaluechanged', onNotify);
    await notifyChar.startNotifications();
    setFound('ffe2', '見つかりました / Notify有効');

    await service.getCharacteristic(UUID_FFF3);
    setFound('fff3', '見つかりました');

    $('status').innerHTML = `状態: <span class="ok">${device.name || 'SX033A'} 接続済み</span>`;
    $('disconnectBtn').disabled = false;
    $('connectBtn').disabled = true;
    appendLog('FFE2 Notify を開始しました');
  } catch (err) {
    $('status').innerHTML = `状態: <span class="warn">エラー</span>`;
    appendLog(`エラー: ${err.name}: ${err.message}`);
  }
}

async function disconnect() {
  try {
    if (notifyChar) {
      try { await notifyChar.stopNotifications(); } catch {}
    }
    if (device?.gatt?.connected) device.gatt.disconnect();
  } catch (err) {
    appendLog(`切断エラー: ${err.message}`);
  }
}

function clearLog() {
  recvCount = 0;
  previousBytes = null;
  changeCounts = [];
  $('count').textContent = '0';
  $('latest').textContent = '—';
  $('diff').textContent = '—';
  $('byteTable').innerHTML = '';
  logEl.textContent = 'まだ受信していません。';
}

$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', disconnect);
$('clearBtn').addEventListener('click', clearLog);
</script>
</main>
</body>
</html>
